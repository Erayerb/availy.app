# Render Blueprint: the v2 backend (FastAPI) as a free web service.
# The database is on Neon (free PostgreSQL with PostGIS); its connection string goes
# into DATABASE_URL in Render's dashboard (never into this file).
services:
  - type: web
    name: availy-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: v2-checkin
    dockerContext: ./backend
    dockerfilePath: ./docker/backend.Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      # Resend API key for "Şifremi unuttum" / e-mail verification codes (set in the dashboard).
      # Without it the codes are only written to the server log.
      - key: RESEND_API_KEY
        sync: false
      # Secret mixed into phone-number hashes ("Rehberden bul"); any long random text, set once
      - key: PHONE_PEPPER
        sync: false
      # Bug reports and contact messages are also e-mailed here (optional)
      - key: SUPPORT_EMAIL
        sync: false
